<title id="t">Qarta Online</title>
<desc id="d">Qarta Online: digital QR menus for restaurants. A QR code is scanned and the menu appears on a phone.</desc>
<style>
.f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.scan{animation:scan 6s ease-in-out infinite}
.glow{animation:glow 6s ease-in-out infinite}
.beam{stroke-dasharray:4 8;animation:beam 6s linear infinite}
.row{animation:row 6s ease-out infinite}
.r2{animation-name:row2}.r3{animation-name:row3}.r4{animation-name:row4}.r5{animation-name:row5}
.hdr{animation:hdr 6s ease-out infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}5%{opacity:1}15%{transform:translateY(110px)}25%{transform:translateY(0);opacity:1}30%,100%{transform:translateY(0);opacity:0}}
@keyframes glow{0%,20%{opacity:0}28%{opacity:.55}40%,100%{opacity:0}}
@keyframes beam{0%,24%{opacity:0;stroke-dashoffset:0}28%{opacity:1}40%{opacity:1;stroke-dashoffset:-48}46%,100%{opacity:0;stroke-dashoffset:-72}}
@keyframes hdr{0%,30%{opacity:0}38%,92%{opacity:1}100%{opacity:0}}
@keyframes row{0%,38%{opacity:0;transform:translateY(6px)}45%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes row2{0%,43%{opacity:0;transform:translateY(6px)}50%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes row3{0%,48%{opacity:0;transform:translateY(6px)}55%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes row4{0%,53%{opacity:0;transform:translateY(6px)}60%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes row5{0%,58%{opacity:0;transform:translateY(6px)}65%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.scan,.glow,.beam,.row,.hdr{animation:none}.scan,.glow{opacity:0}}
</style>
